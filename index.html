<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairos Kinesis – Accueil</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ======================
           BASE
        ====================== */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', Arial, sans-serif;
            background-color: #ffffff;
            color: #344D59;
        }

        /* ======================
           HEADER / BANDEAU
        ====================== */
        header {
            position: relative;
            width: 100%;
            height: 110px;
            overflow: hidden;
        }

        header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #344D59;
            background-color: rgba(255, 255, 255, 0.75);
            padding: 6px 10px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* ======================
           CONTENU PRINCIPAL
        ====================== */
        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 30px;
            box-sizing: border-box;
        }

        .grid-intro {
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            margin: 12px 0 20px 0;
            line-height: 1.3;
        }

        /* ======================
           GRILLE D’IMAGES
        ====================== */
 .rows {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;

    overflow: visible; /* important */
}

.rows img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 6px;
    display: block;
    cursor: pointer;

    position: relative;
    z-index: 1;

    transition: transform 0.4s ease, z-index 0s;
}

.rows img:hover {
    transform: scale(1.75);   /* ← c’est là la différence */
    z-index: 10;              /* ← passe devant les autres */
}

    </style>
</head>

<body>

<header>
    <img src="Images/Bandeau.png" alt="">
    <div class="banner-title"> </div>
</header>

<main>

    <div class="grid-intro">
        Quel pays vous attire ? Pas parce que vous aimeriez le visiter mais pour ce que l'image évoque pour vous.
    </div>

    <div class="rows">
        <img src="Images/Intuition-Federatrice.png" alt="">
        <img src="Images/Rigueur-Methodique.png" alt="">
        <img src="Images/Rigueur-Vigilante.png" alt="">
        <img src="Images/Intuition-Conceptuelle.png" alt="">
        <img src="Images/Audace-Confrontante.png" alt="">
        <img src="Images/Protection-Active.png" alt="">
        <img src="Images/Protection-Apaisante.png" alt="">
        <img src="Images/Audace-Ambitieuse.png" alt="">
    </div>

</main>

<!-- SCRIPT : INCHANGÉ -->
<script>
    const images = document.querySelectorAll(".rows img");
    
    images[1].addEventListener("click", () => {
        window.location.href = "Rigoureux/Non-Rigoureux.html";});

    images[3].addEventListener("click", () => {
        window.location.href = "Intuitifs/Non-Intuitifs.html"; });

    images[0].addEventListener("click", () => {
        window.location.href = "Intuitifs/Non-Intuitifs.html"; });
   
</script>

</body>
</html>
